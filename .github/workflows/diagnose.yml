name: WAF Diagnosis

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test WAF behavior with curl
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          UA_CHROME='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'

          echo "=========================================="
          echo "Test 1: GET / (TOPページ)"
          echo "=========================================="
          curl -s -o /dev/null -w "HTTP: %{http_code} / Time: %{time_total}s\n" "$WP_URL/"
          echo ""

          echo "=========================================="
          echo "Test 2: GET / (Chrome UA)"
          echo "=========================================="
          curl -s -o /dev/null -w "HTTP: %{http_code} / Time: %{time_total}s\n" -A "$UA_CHROME" "$WP_URL/"
          echo ""

          echo "=========================================="
          echo "Test 3: GET /wp-json/ (REST APIルート)"
          echo "=========================================="
          curl -s -o /dev/null -w "HTTP: %{http_code} / Time: %{time_total}s\n" "$WP_URL/wp-json/"
          echo ""

          echo "=========================================="
          echo "Test 4: GET /wp-json/ (Chrome UA)"
          echo "=========================================="
          curl -s -o /dev/null -w "HTTP: %{http_code} / Time: %{time_total}s\n" -A "$UA_CHROME" "$WP_URL/wp-json/"
          echo ""

          echo "=========================================="
          echo "Test 5: GET /wp-json/wp/v2/categories (デフォルトUA)"
          echo "=========================================="
          curl -s -o /dev/null -w "HTTP: %{http_code} / Time: %{time_total}s\n" "$WP_URL/wp-json/wp/v2/categories"
          echo ""

          echo "=========================================="
          echo "Test 6: GET /wp-json/wp/v2/categories (Chrome UA)"
          echo "=========================================="
          curl -s -o /dev/null -w "HTTP: %{http_code} / Time: %{time_total}s\n" -A "$UA_CHROME" "$WP_URL/wp-json/wp/v2/categories"
          echo ""

          echo "=========================================="
          echo "Test 7: GET /wp-json/wp/v2/posts (Chrome UA)"
          echo "=========================================="
          curl -s -o /dev/null -w "HTTP: %{http_code} / Time: %{time_total}s\n" -A "$UA_CHROME" "$WP_URL/wp-json/wp/v2/posts"
          echo ""

          echo "=========================================="
          echo "Test 8: GET /wp-json/wp/v2/categories (Chrome UA + Auth)"
          echo "=========================================="
          curl -s -o /dev/null -w "HTTP: %{http_code} / Time: %{time_total}s\n" -A "$UA_CHROME" -u "$WP_USERNAME:$WP_APP_PASSWORD" "$WP_URL/wp-json/wp/v2/categories"
          echo ""

          echo "=========================================="
          echo "Test 9: HEADERS応答の確認 (TOPページ)"
          echo "=========================================="
          curl -s -I -A "$UA_CHROME" "$WP_URL/" | head -20
          echo ""

          echo "=========================================="
          echo "Test 10: HEADERS応答の確認 (categories)"
          echo "=========================================="
          curl -s -I -A "$UA_CHROME" "$WP_URL/wp-json/wp/v2/categories" | head -20
          echo ""

          echo "=========================================="
          echo "Test 11: 実際のレスポンスボディ (categories)"
          echo "=========================================="
          curl -s -A "$UA_CHROME" "$WP_URL/wp-json/wp/v2/categories" | head -c 500
          echo ""
          echo ""

          echo "=========================================="
          echo "Test 12: GitHub Runner の外部IP"
          echo "=========================================="
          curl -s https://api.ipify.org
          echo ""
