name: WordPress Auto Post

on:
  push:
    branches: [main]
    paths:
      - 'posts/*.md'
      - 'post.py'
      - 'requirements.txt'
  workflow_dispatch:

# 二重実行防止: 同一ワークフロー＋同一ブランチの並列実行を抑止する。
# cancel-in-progress: false にして実行中ジョブを途中停止させない（POST 済み・ファイル
# 移動前で停止されると整合性が崩れるため）。後続の push/dispatch はキューで待つ。
concurrency:
  group: wp-auto-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Japanese fonts (for eyecatch PNG)
        run: |
          sudo apt-get update -qq
          # NotoSansJP（JP専用）+ NotoCJK（フォールバック）+ IPAex（最終フォールバック）
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            fonts-ipaexfont-gothic \
            fonts-ipafont-gothic
          # NotoSansJP-Bold.otf を直接ダウンロード（apt 版にJP単体が無い場合の保険）
          sudo mkdir -p /usr/share/fonts/opentype/noto
          if [ ! -f /usr/share/fonts/opentype/noto/NotoSansJP-Bold.otf ]; then
            sudo wget -q -O /usr/share/fonts/opentype/noto/NotoSansJP-Bold.otf \
              "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansJP-Bold.otf" || true
          fi
          if [ ! -f /usr/share/fonts/opentype/noto/NotoSansJP-Regular.otf ]; then
            sudo wget -q -O /usr/share/fonts/opentype/noto/NotoSansJP-Regular.otf \
              "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansJP-Regular.otf" || true
          fi
          sudo fc-cache -f -v
          # 確認用ログ
          fc-list :lang=ja | head -10 || true
          echo "--- noto-cjk ttc files ---"
          ls -la /usr/share/fonts/opentype/noto/ 2>/dev/null || true
          ls -la /usr/share/fonts/truetype/noto/ 2>/dev/null || true

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post articles to WordPress
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python post.py

      - name: Commit moved files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --staged --quiet; then
            echo "No file changes to commit."
            exit 0
          fi
          git commit -m "chore: move published posts to posts/published/ [skip ci]"
          # リモートの最新を取り込んでから push（衝突対策）
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing..."
            git pull --rebase origin main || true
            sleep 2
          done
          echo "Push failed after 3 retries"
          exit 1
