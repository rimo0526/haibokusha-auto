name: Fix CTA v2 (Image-rich)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Mode dry/apply'
        required: true
        default: 'dry'
        type: choice
        options:
          - dry
          - apply
      limit:
        description: '対象上限（0=全件）'
        required: false
        default: '0'
      only_id:
        description: '特定 post ID のみ（空欄=全件）'
        required: false
        default: ''

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run fix_cta_v2.py
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -x
          # 空文字 limit/only_id で argparse が落ちないようガード
          ARGS=""
          if [ "${{ inputs.apply }}" = "apply" ]; then ARGS="$ARGS --apply"; fi
          if [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ -n "${{ inputs.only_id }}" ]; then
            ARGS="$ARGS --only-id ${{ inputs.only_id }}"
          fi
          echo "Final ARGS: [$ARGS]"
          echo "WP_URL set: ${WP_URL:+yes} (len=${#WP_URL})"
          echo "WP_USERNAME set: ${WP_USERNAME:+yes} (len=${#WP_USERNAME})"
          echo "WP_APP_PASSWORD set: ${WP_APP_PASSWORD:+yes} (len=${#WP_APP_PASSWORD})"
          python fix_cta_v2.py $ARGS
